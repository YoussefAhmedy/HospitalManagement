name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore HospitalManagement.sln
      - name: Build
        run: dotnet build HospitalManagement.sln --configuration Release --no-restore
      - name: Test
        run: >
          dotnet test HospitalManagement.sln
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      # Test failures do not produce annotations on their own, so the TRX file is parsed
      # into a compact failure list. This keeps a red build diagnosable from the API
      # without downloading logs.
      - name: Summarise failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for path in glob.glob('**/test-results.trx', recursive=True):
              root = ET.parse(path).getroot()
              for result in root.findall('.//t:UnitTestResult', ns):
                  if result.get('outcome') == 'Failed':
                      message = result.find('t:Output/t:ErrorInfo/t:Message', ns)
                      text = ' '.join((message.text or '').split()) if message is not None else 'failed'
                      print(f"::error title=Test failed::{result.get('testName')}: {text[:600]}")
          PY

  migrations:
    # Generates the EF Core migration from the model so the database schema is never
    # hand-authored, and uploads it for review. Runs after a green build.
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore HospitalManagement.sln
      - name: Scaffold migration from the model
        run: >
          dotnet ef migrations add InitialSchema
          --project DAL/Hospital.DAL.csproj
          --startup-project HospitalManagement/HospitalManagement.csproj
          --output-dir Migrations
      - name: List migrations
        run: >
          dotnet ef migrations list
          --project DAL/Hospital.DAL.csproj
          --startup-project HospitalManagement/HospitalManagement.csproj
          --no-connect
      - name: Generate idempotent SQL script
        run: >
          dotnet ef migrations script --idempotent
          --project DAL/Hospital.DAL.csproj
          --startup-project HospitalManagement/HospitalManagement.csproj
          --output "${{ runner.temp }}/careaxis-schema.sql"
      - name: Upload migration artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ef-migrations
          path: |
            DAL/Migrations/**
            ${{ runner.temp }}/careaxis-schema.sql
          if-no-files-found: error
          retention-days: 14
